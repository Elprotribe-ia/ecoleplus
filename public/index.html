<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123c35">
  <title>ÉcolePlus — Gestion scolaire</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard">
        <img src="logo-reversed.svg" alt="ÉcolePlus — Gestion scolaire">
      </a>
      <div class="school">
        <b class="crest" id="schoolCrest">É+</b>
        <span>
          <strong id="schoolName">Mon établissement</strong>
          <small id="schoolPlaceYear">Ville · Année scolaire</small>
        </span>
        <i>⌄</i>
      </div>
      <small class="label">ESPACE ÉTABLISSEMENT</small>
      <nav id="nav"></nav>
      <div class="bottom">
        <i></i>
        <span><b>Mode local</b><small>Données sur cet appareil</small></span>
      </div>
      <div class="profile">
        <b id="adminInitials">AD</b>
        <span>
          <strong id="adminName">Administrateur</strong>
          <small id="adminRole">Direction</small>
        </span>
      </div>
    </aside>

    <main>
      <header>
        <button class="hamb" id="hamb">☰</button>
        <div class="crumb">ÉcolePlus <i>/</i> <b id="crumb">Tableau de bord</b></div>
        <div class="right">
          <input id="search" placeholder="⌕  Rechercher…">
          <button class="bell">♧</button>
          <b class="user">MN</b>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <div id="modal"></div>
  <div id="toast"></div>

  <script src="offline.js"></script>
  <script src="app.js"></script>
</body>
</html>
