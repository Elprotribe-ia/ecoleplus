<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉcolePlus</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CONNEXION -->
<div id="login" class="login">
  <div class="login-gauche">
    <div class="logo"><img src="logo.svg" alt="" class="logo-img">ÉcolePlus</div>
    <div class="cercle c1"></div>
    <div class="cercle c2"></div>
    <div class="login-texte">
      <h2>L’école,<br>simplement.</h2>
      <p>Une gestion fiable, même lorsque la connexion ne l’est pas.</p>
    </div>
  </div>
  <div class="login-droite">
    <div class="login-box">
      <h1>Bienvenue</h1>
      <p class="muted">Connectez-vous à votre établissement</p>
      <label>Établissement</label>
      <p id="login-ecole" class="champ"></p>
      <label for="login-id">Identifiant</label>
      <input id="login-id" class="champ" placeholder="Votre identifiant" autocomplete="username">
      <label for="login-mdp">Mot de passe</label>
      <input id="login-mdp" class="champ" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="login-btn" class="btn">Connexion sécurisée</button>
      <p id="login-err" class="erreur"></p>
      <p class="hors-ligne">✓ Vos données restent disponibles hors connexion</p>
    </div>
  </div>
</div>

<!-- APPLICATION -->
<div id="app" class="app cache">
  <aside id="menu" class="menu"></aside>
  <div class="voile" onclick="document.getElementById('menu').classList.remove('ouvert')"></div>
  <main class="main">
    <header class="top">
      <button id="btn-menu" class="btn-menu" aria-label="Ouvrir le menu">☰</button>
      <h2 id="titre"></h2>
      <input class="recherche" placeholder="Rechercher un élève…" aria-label="Rechercher un élève">
      <button id="btn-logout" class="avatar" title="Se déconnecter" aria-label="Se déconnecter">MA</button>
    </header>
    <section id="vue" class="vue"></section>
  </main>
</div>

<div id="toast" class="toast cache"></div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="m-classes.js"></script>
<script src="m-eleves.js"></script>
<script src="m-parametres.js"></script>
<script src="app.js"></script>
</body>
</html>
