<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÉcolePlus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login" class="login">
  <div class="login-box">
    <h1>ÉcolePlus</h1>
    <p id="login-ecole" class="muted"></p>
    <input id="login-id" placeholder="Identifiant" autocomplete="username">
    <input id="login-mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="login-btn" class="btn">Se connecter</button>
    <p id="login-err" class="erreur"></p>
  </div>
</div>

<div id="app" class="app cache">
  <aside id="menu" class="menu"></aside>
  <main class="main">
    <header class="top">
      <button id="btn-menu" class="btn-ico">☰</button>
      <h2 id="titre"></h2>
      <button id="btn-logout" class="btn-ico">Quitter</button>
    </header>
    <section id="vue" class="vue"></section>
  </main>
</div>

<div id="toast" class="toast cache"></div>

<script src="data.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
